<style>
:root{--bg:#000;--card:#111;--line:#2a2a2a;--tx:#fff;--mut:#b5b5b5;--or:#ff7a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;line-height:1.5}
header{padding:20px 16px;border-bottom:2px solid var(--or)}
h1{margin:0;font-size:1.6rem}
h1 span{color:var(--or)}
.sub{color:var(--mut);font-size:.9rem;margin-top:4px}
main{display:grid;grid-template-columns:2fr 1fr;gap:16px;padding:16px;max-width:1200px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:var(--card);color:var(--tx);border:1px solid var(--or);padding:10px 14px;border-radius:8px;font-size:.95rem;cursor:pointer}
.tab.on{background:var(--or);color:#000;font-weight:700}
.tab small{opacity:.8}
input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);margin-bottom:12px;font-size:1rem}
.job{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--or);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.job h3{margin:0 0 6px;font-size:1.05rem}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.88rem;color:var(--mut)}
.pill{background:var(--or);color:#000;font-weight:700;border-radius:20px;padding:2px 10px;font-size:.85rem}
.note{font-size:.82rem;color:var(--mut);margin-top:6px}
a.btn{display:inline-block;margin-top:8px;background:var(--or);color:#000;text-decoration:none;font-weight:700;padding:6px 12px;border-radius:6px;font-size:.88rem}
.dl{color:var(--or);font-weight:700}
aside{background:var(--card);border:1px solid var(--or);border-radius:12px;padding:14px;align-self:start}
aside h2{margin:0 0 10px;color:var(--or);font-size:1.15rem}
.ben{border-top:1px solid var(--line);padding:10px 0;font-size:.92rem}
.ben a{color:var(--or)}
.empty{color:var(--mut);padding:16px;border:1px dashed var(--line);border-radius:10px}
footer{color:var(--mut);font-size:.8rem;padding:16px;text-align:center}
</style>

{t:"UDID / Swavlamban कार्ड",d:"दिव्यांग प्रमाणपत्र और कार्ड की आधिकारिक साइट।",l:"https://www.swavlambancard.gov.in"},
{t:"दिव्यांगजन सशक्तिकरण विभाग (DEPwD)",d:"केंद्र सरकार की योजनाओं और नई घोषणाओं के लिए।",l:"https://disabilityaffairs.gov.in"},
{t:"National Career Service",d:"दिव्यांगजनों के लिए जॉब पोर्टल।",l:"https://www.ncs.gov.in"}
];
document.getElementById("nm").textContent=NAME;
document.getElementById("upd").textContent=UPDATED;
var TABS=[["gov","सरकारी जॉब (ऑनलाइन)"],["offline","ऑफलाइन सरकारी जॉब"],["private","प्राइवेट जॉब"]];
var cur="gov";
function ok(j){return j.pwbd>0&&!BLOCK.test(j.title+" "+j.org)}
function days(d){var t=new Date(d+"T23:59:59+05:30")-new Date();return Math.ceil(t/864e5)}
function esc(s){var e=document.createElement("div");e.textContent=s;return e.innerHTML}
function draw(){
 var q=document.getElementById("q").value.toLowerCase();
 var tb=document.getElementById("tabs");tb.innerHTML="";
 TABS.forEach(function(t){
  var n=JOBS.filter(function(j){return j.kind===t[0]&&ok(j)}).length;
  var b=document.createElement("button");b.className="tab"+(cur===t[0]?" on":"");
  b.innerHTML=esc(t[1])+" <small>("+n+")</small>";
  b.onclick=function(){cur=t[0];draw()};tb.appendChild(b)});
 var L=JOBS.filter(function(j){return j.kind===cur&&ok(j)&&(j.title+j.org).toLowerCase().indexOf(q)>-1})
  .sort(function(a,b){return a.last<b.last?-1:1});
 var h="";
 L.forEach(function(j){
  var d=days(j.last);
  if(d<0)return;
  h+='<div class="job"><h3>'+esc(j.title)+'</h3><div class="row"><span>'+esc(j.org)+'</span><span class="pill">PwBD वैकेंसी: '+esc(j.posts)+'</span><span class="dl">आखिरी तारीख: '+esc(j.last)+' ('+d+' दिन बाकी)</span></div>'+(j.note?'<div class="note">'+esc(j.note)+'</div>':'')+'<a class="btn" href="'+esc(j.link)+'" target="_blank" rel="noopener">नोटिफिकेशन / Apply</a></div>'});
 document.getElementById("list").innerHTML=h||'<div class="empty">इस सेक्शन में अभी कोई जॉब नहीं है जिसमें PwBD वैकेंसी हो।</div>';
}
document.getElementById("q").oninput=draw;
// jobs.json से लाइव डेटा लोड करो (हर 30 मिनट में बॉट इसे अपडेट करता है)
function loadLive(){
 fetch("jobs.json?t="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
  if(d&&d.jobs&&d.jobs.length){
   var keep=JOBS.filter(function(j){return j.manual});
   JOBS=d.jobs.concat(keep);
   if(d.updated){var t=new Date(d.updated);document.getElementById("upd").textContent=t.toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"})}
   draw();
  }
 }).catch(function(){});
}
loadLive();
setInterval(loadLive,300000);
document.getElementById("ben").innerHTML=BEN.map(function(b){return '<div class="ben"><b>'+esc(b.t)+'</b><br>'+esc(b.d)+'<br><a href="'+esc(b.l)+'" target="_blank" rel="noopener">आधिकारिक साइट खोलें</a></div>'}).join("");
draw();
